apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-kg.fullname" . }}
  labels:
    {{- include "kube-kg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-kg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-kg.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KUBEVIEW_URL
              value: {{ include "kube-kg.fullname" . | printf "http://%s-kubeview:8000" | quote }}
            - name: NEO4J_URI
              value: {{ include "kube-kg.fullname" . | printf "neo4j://%s-neo4j:7687" | quote }}
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.neo4j.name | printf "%s-auth" | quote }}
                  key: NEO4J_AUTH
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
